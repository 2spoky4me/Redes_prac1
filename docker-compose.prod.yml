name: redes_prac1_prod

services:
  db_prod:
    image: postgres:16-alpine
    container_name: db_prod
    env_file: .env.prod
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - vol_prod:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - red_prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost -p 5432"]
      interval: 5s
      timeout: 2s
      retries: 10

  cache:
    image: redis:7-alpine
    container_name: cache
    networks:
      - red_prod
      
      # Comprueba que Redis responde correctamente.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  web_prod:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: web_prod
    depends_on:
      db_prod:
        condition: service_healthy
      cache:
        condition: service_started
    env_file: .env.prod
    ports:
      - "${WEB_PORT}:8000"
    networks:
      - red_prod
    healthcheck:
      # Comprueba que Flask, PostgreSQL y Redis funcionan correctamente.
      # Consulta /status y verifica las dos conexiones.
      test:
        - CMD
        - python
        - -c
        - >
          import json, urllib.request, sys;
          j = json.load(urllib.request.urlopen('http://localhost:8000/status', timeout=3));
          sys.exit(0 if j.get('db_connected') and j.get('cache_connected') else 1)

      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  red_prod:
    name: red_prod  

volumes:
  vol_prod:
    name: vol_prod  
